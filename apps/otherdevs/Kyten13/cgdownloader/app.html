<!DOCTYPE HTML>
<html>
    <head>
        <title>H E Y</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            font-weight: 500;
            font-size: 1.75rem;
            letter-spacing: 0.3em;
            margin-bottom: 24px;
            color: #333;
        }
        button {
            font-family: inherit;
            font-size: 0.95rem;
            background: #fff;
            color: #1a1a1a;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px 28px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 28px;
        }
        button:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        button:active {
            transform: scale(0.97);
        }
        #img {
            width: 420px;
            height: 420px;
            border: 1px solid #ddd;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        #img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        </style>
    </head>
    <body>
        <h1>S E C R E T</h1>
        <button onclick="uwu()">CLICK ME</button>
        <div id="img"></div>
        <script>

            async function uwu() {
                const url = "https://nekos.best/api/v2/neko";
                try {
                    const response = await fetch(url);
                    const result = await response.json();
                    const imgurl = result.results[0].url;
                    const imgdiv = document.getElementById('img');
                    imgdiv.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = imgurl;
                    img.style.maxWidth = '100%';
                    imgdiv.appendChild(img);
                } catch {
                console.log("error");
                }
            }
        </script>
    </body>
</html>
